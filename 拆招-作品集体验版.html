<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拆招｜作品集体验版</title>
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-light:#eff6ff;
  --accent:#f59e0b; --accent-light:#fff7ed;
  --bg:#f1f5f9; --card:#ffffff;
  --text:#1e293b; --text-light:#64748b; --border:#e2e8f0;
  --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-lg:0 10px 25px -5px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}

/* ===== Sidebar ===== */
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:24px 20px;border-bottom:1px solid var(--border)}
.brand-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-slogan{font-size:12px;color:var(--text-light);margin-top:4px}
.nav{padding:16px 12px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text-light);font-size:14px;margin-bottom:2px;transition:all .2s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:11px;background:var(--primary);color:#fff;border-radius:10px;padding:1px 7px;font-weight:700}
.user-card{padding:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:700}
.user-role{font-size:12px;color:var(--text-light)}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.page-title{font-size:20px;font-weight:700}
.header-right{display:flex;align-items:center;gap:12px}
.header-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--bg)}
.content{flex:1;overflow-y:auto;padding:24px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-wrap{animation:fadeIn .25s ease}
@keyframes flashHi{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 3px var(--accent)}}
.highlight{animation:flashHi 1.6s ease}

/* ===== Components ===== */
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-value{font-size:32px;font-weight:900;color:var(--primary);margin-bottom:4px}
.stat-label{font-size:13px;color:var(--text-light)}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .3s ease}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;margin-right:6px}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.tag-orange{background:var(--accent-light);color:#9a3412}
.tag-green{background:#d1fae5;color:#065f46}
.tag-gray{background:var(--bg);color:var(--text-light)}
.tag-red{background:#fee2e2;color:#991b1b}
.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text)}
.input:focus{outline:none;border-color:var(--primary)}
textarea.input{resize:vertical;min-height:80px}
label.fld{display:block;font-size:14px;margin-bottom:6px;font-weight:600}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:8px 14px;border:1px solid var(--border);background:var(--card);border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text)}
.filter-btn.active,.filter-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{color:var(--text-light);font-size:14px;padding:16px 0;text-align:center}
.muted{color:var(--text-light)}
.section-title{font-size:18px;font-weight:700;margin-bottom:16px}

/* ===== Toast ===== */
.toast{position:fixed;top:80px;right:24px;background:rgba(30,41,59,.96);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;opacity:0;transform:translateX(20px);transition:all .3s;z-index:9999;max-width:380px;display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;transform:translateX(0)}
.toast-goto{background:rgba(255,255,255,.18);border:none;color:#fff;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;font-family:inherit}
.toast-goto:hover{background:rgba(255,255,255,.3)}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1999;display:none}
.overlay.show{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:680px;max-width:calc(100vw - 48px);max-height:84vh;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);z-index:2000;padding:28px;overflow-y:auto;display:none}
.modal.show{display:block}
.modal.wide{width:900px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.modal-head h2{font-size:20px}

/* ===== Today ===== */
.welcome-section{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.welcome-text h1{font-size:26px;margin-bottom:6px}
.welcome-text p{color:var(--text-light)}
.quick-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.task-list{margin-top:12px}
.task-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.task-item:last-child{border-bottom:none}
.task-item.completed{opacity:.6}
.task-checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
.task-item.completed .task-checkbox{background:var(--success);border-color:var(--success)}
.task-item.completed .task-text{text-decoration:line-through}
.task-text{flex:1;font-size:14px}
.task-why{font-size:12px;color:var(--text-light);border:1px dashed var(--border);border-radius:6px;padding:2px 8px;cursor:help;flex-shrink:0}
.inline-add{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}

/* ===== 分步进度 ===== */
.step-track{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.step-node{display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--text-light);border:1px solid var(--border)}
.step-node.done{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
.step-node.now{background:var(--primary-light);color:var(--primary);border-color:#bfdbfe;font-weight:700}
.step-arrow{color:var(--border);font-size:12px}
.prog-row{padding:14px 0;border-bottom:1px solid var(--border)}
.prog-row:last-child{border-bottom:none}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;font-weight:600}
.prog-remain{font-size:12px;color:var(--text-light);font-weight:400;white-space:nowrap}
.chip-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)}
.chip.done{background:#d1fae5;border-color:#a7f3d0;color:#065f46}
.chip.doing{background:var(--accent-light);border-color:#fed7aa;color:#9a3412}
.chip.todo{background:var(--bg);color:var(--text-light)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.tbl th{text-align:left;color:var(--text-light);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}
table.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}

/* ===== Collect ===== */
.collect-layout{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;align-items:start}
.idea-card{background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--border);margin-bottom:12px;border-left:4px solid var(--primary)}
.idea-text{font-size:14px;margin-bottom:10px;line-height:1.6}
.idea-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.idea-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== 理顺流程 ===== */
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.choice-btn{padding:16px;border:2px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;transition:all .2s;font-family:inherit}
.choice-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.choice-btn .ci{font-size:24px;display:block;margin-bottom:8px}
.choice-btn strong{display:block;font-size:15px;margin-bottom:4px;color:var(--text)}
.choice-btn span{font-size:12px;color:var(--text-light);line-height:1.5}
.path-nodes{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.path-node{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-light);background:var(--card)}
.path-node.done{border-color:var(--success);background:var(--success);color:#fff}
.path-node.now{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:700}
.q-label{font-size:12px;color:var(--text-light);letter-spacing:1px}
.q-title{font-size:19px;font-weight:700;margin:6px 0 14px;line-height:1.5}
.outline-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--bg);margin-bottom:6px;font-size:13px;width:100%;border:none;cursor:pointer;text-align:left;font-family:inherit;color:var(--text)}
.outline-row.done{background:#d1fae5}
.outline-row.now{background:var(--primary-light);color:var(--primary);font-weight:600}
.outline-row .st{margin-left:auto;font-size:11px;color:var(--text-light);white-space:nowrap}
.candidate{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card)}
.candidate strong{font-size:14px;display:block;margin-bottom:3px}
.candidate p{font-size:12px;color:var(--text-light)}

/* ===== Explore ===== */
.explore-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.card-stack{position:relative;height:420px;display:flex;align-items:center;justify-content:center;width:100%}
.explore-card{position:absolute;width:360px;background:var(--card);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg);border:1px solid var(--border);transition:transform .3s ease,opacity .3s ease;text-align:center}
.explore-card.swipe-left{transform:translateX(-150%) rotate(-12deg);opacity:0}
.explore-card.swipe-right{transform:translateX(150%) rotate(12deg);opacity:0}
.explore-icon{font-size:56px;margin-bottom:20px}
.explore-title{font-size:24px;font-weight:800;margin-bottom:12px}
.explore-desc{color:var(--text-light);font-size:14px;margin-bottom:20px;line-height:1.7}
.swipe-actions{display:flex;justify-content:center;gap:20px;margin-top:24px}
.swipe-btn{width:56px;height:56px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:24px;cursor:pointer;transition:all .2s}
.swipe-btn:hover{transform:scale(1.05)}
.swipe-btn.no{color:var(--danger);border-color:var(--danger)}
.swipe-btn.yes{color:var(--primary);border-color:var(--primary)}
.explore-record-item{padding:12px;background:var(--bg);border-radius:8px;margin-bottom:10px;font-size:14px}
.evidence{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px;font-size:13px;line-height:1.9}
.evidence div{display:flex;gap:10px}
.evidence .k{color:var(--text-light);white-space:nowrap;min-width:64px}

/* ===== Jobs ===== */
.job-card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);cursor:pointer;transition:all .2s;text-align:left;font-family:inherit;width:100%}
.job-card:hover{border-color:var(--primary);box-shadow:var(--shadow-lg)}
.job-card h3{font-size:16px;margin-bottom:8px}
.job-card p{font-size:13px;color:var(--text-light);margin-bottom:12px;line-height:1.6}
.duty{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.duty:last-child{border-bottom:none}
.duty-main{flex:1;min-width:0}
.duty-task{font-size:14px;font-weight:600;margin-bottom:4px}
.duty-how{font-size:13px;color:var(--text-light);line-height:1.7}
.duty-cap{flex-shrink:0}
.cap-jump{cursor:pointer}
.cap-jump:hover{background:var(--primary);color:#fff}
.cap-row{padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.cap-row.hi{border-color:var(--primary);background:var(--primary-light)}
.cap-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.cap-where{font-size:12px;color:var(--primary);margin:6px 0;line-height:1.9}
.cap-link{cursor:pointer;border-bottom:1px dashed var(--primary);padding-bottom:1px}
.cap-link:hover{background:var(--primary-light);border-bottom-style:solid}
.cap-build{font-size:13px;color:var(--text-light);line-height:1.7}
.subhead{font-size:13px;font-weight:700;color:var(--text-light);letter-spacing:1px;margin:22px 0 10px;text-transform:uppercase}
.day-row{display:flex;gap:12px;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--border)}
.day-row:last-child{border-bottom:none}
.day-time{color:var(--primary);font-weight:700;white-space:nowrap;min-width:52px}
.day-act{flex:1}

/* ===== Board ===== */
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.board-column{min-width:300px;flex:1;background:var(--bg);border-radius:12px;padding:16px}
.board-column.dragover{outline:2px dashed var(--primary);outline-offset:-4px;background:var(--primary-light)}
.board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700;font-size:14px}
.board-card{background:var(--card);border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:grab;border:1px solid var(--border);border-left:4px solid var(--border);position:relative}
.board-card:active{cursor:grabbing}
.board-card.dragging{opacity:.4}
.board-card.p-high{border-left-color:var(--danger)}
.board-card.p-mid{border-left-color:var(--accent)}
.board-card.p-low{border-left-color:var(--text-light)}
.board-card h4{font-size:14px;margin-bottom:6px;padding-right:20px}
.board-card .bc-line{font-size:12px;color:var(--text-light);line-height:1.6;margin-bottom:4px}
.board-card .bc-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--text-light)}
.bc-del{position:absolute;top:10px;right:10px;border:none;background:none;color:var(--text-light);cursor:pointer;font-size:14px;line-height:1}

/* ===== Interview ===== */
.interview-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.interview-type{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;width:100%;font-family:inherit;text-align:left}
.interview-type:hover,.interview-type.active{border-color:var(--primary);background:var(--primary-light)}
.interview-type-icon{font-size:24px}
.interview-type-name{font-weight:600;font-size:14px}
.interview-stage{background:var(--card);border-radius:12px;padding:32px;text-align:center;min-height:400px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--border);box-shadow:var(--shadow)}
.timer{font-size:48px;font-weight:900;color:var(--primary);margin-bottom:20px;font-variant-numeric:tabular-nums}
.timer.paused{color:var(--accent)}
.question{font-size:22px;font-weight:700;margin-bottom:20px;line-height:1.6}
.hint{color:var(--text-light);font-size:14px;margin-bottom:20px;line-height:1.7}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px}
.seg button{padding:7px 14px;border:none;background:var(--card);cursor:pointer;font-size:13px;font-family:inherit;color:var(--text-light);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--primary);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 16px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--text-light);border-bottom:2px solid transparent;font-family:inherit;font-weight:600}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.rate-row{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.rate-item{font-size:13px}
.rate-item select{margin-left:6px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-family:inherit}

/* ===== Profile ===== */
.profile-header{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;flex-shrink:0}
.profile-name{font-size:24px;font-weight:800}
.profile-status{color:var(--text-light)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat-cell{width:12px;height:12px;border-radius:2px;background:var(--border)}
.heat-cell.l1{background:#bfdbfe}.heat-cell.l2{background:#60a5fa}.heat-cell.l3{background:#2563eb}
.tag-trace{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;background:var(--card)}
.tag-trace summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.tag-trace summary::-webkit-details-marker{display:none}
.tag-trace .src{font-size:12px;color:var(--text-light);line-height:1.8;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}

/* ===== Survey ===== */
.step-ind{flex:1;text-align:center;padding:12px;border-bottom:3px solid var(--border);color:var(--text-light);font-size:14px}
.step-ind.now{border-bottom-color:var(--primary);color:var(--primary);font-weight:700}
.step-ind.done{border-bottom-color:var(--success);color:var(--success)}
.option-card{padding:16px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;background:var(--card);text-align:left;font-family:inherit;width:100%}
.option-card:hover{border-color:var(--primary);background:var(--primary-light)}
.option-card .ot{font-weight:700;margin-bottom:6px;font-size:14px}
.option-card .od{font-size:13px;color:var(--text-light);line-height:1.5}

function cleanLegacyDemo(d){
  const old = legacySeed();
  const same = (a,b)=>JSON.stringify(a)===JSON.stringify(b);
  for(const key of ['ideas','projects','todayTasks','resumes','applications']){
    if(Array.isArray(d[key])) d[key]=d[key].filter(item=>!old[key].some(example=>same(item,example)));
  }
  if(Array.isArray(d.interview?.history)) d.interview.history=d.interview.history.filter(item=>!old.interview.history.some(example=>same(item,example)));
  if(Array.isArray(d.interview?.wrongBook)) d.interview.wrongBook=d.interview.wrongBook.filter(item=>!old.interview.wrongBook.some(example=>
    same(Object.fromEntries(Object.keys(example).map(k=>[k,item[k]])),example) &&
    !item.lastSessionId && !item.recordings?.length && !item.attempts?.length));
  if(d.profile){
    for(const key of ['name','school','grade','goal','skills']) if(same(d.profile[key],old.profile[key])) d.profile[key]=seed().profile[key];
  }
  if(d.goal?.targetJob===old.goal.targetJob) d.goal.targetJob='';
  if(d.checkins){
    for(const [day,count] of Object.entries(old.checkins)) if(d.checkins[day]===count) delete d.checkins[day];
  }
  if(d.streak===old.streak && !Object.keys(d.checkins||{}).length) d.streak=0;
}

  d.interview.wrongBook= Array.isArray(d.interview?.wrongBook) ? d.interview.wrongBook : [];

  d.checkins    = d.checkins || {};
  d.goal        = Object.assign(s.goal, d.goal || {});
  d.streak      = Number(d.streak) || 0;
  d.guideDismissed = Boolean(d.guideDismissed);
  return d;
}
function persistState(){
  if(storageConflict){toast('另一页面更新了数据，请刷新本页后继续，避免覆盖最新记录。');return false;}
  try{
    const previous=localStorage.getItem(STORE);
    if(previous){try{localStorage.setItem(STORE+'-last-good',previous);}catch{ /* Main save takes priority over an extra snapshot. */ }}
    localStorage.setItem(STORE,JSON.stringify(state));return true;
  }catch(e){toast('保存失败：请先导出备份，不要关闭页面。浏览器可能已禁止存储或空间不足。');return false;}
}
function save(){ if(!persistState())throw Error('数据未保存');renderNav(); }
window.addEventListener('storage',e=>{if(e.key===STORE){storageConflict=true;toast('另一个页面已更新数据，请刷新本页后继续。');}});
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }
function taskSource(t){
  if(t.source) return t.source;
  if(t.reason==='手动添加'||t.reason?.startsWith('来自 ')) return 'manual';
  if(t.reason && /^(你在 |这条投递已|这个项目正在|这个简历版本|你已练 |已探索 |收集箱里有 )/.test(t.reason)) return 'suggested';
  return 'manual';
}

/* ========== 6. Toast（可跳转） ========== */
let toastTimer = null;
function toast(msg, gotoPage, gotoLabel){
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.innerHTML = esc(msg) + (gotoPage ? ` <button class="toast-goto" data-goto="${esc(gotoPage)}">${esc(gotoLabel||'去看看')}</button>` : '');
  const btn = t.querySelector('.toast-goto');
  if(btn) btn.addEventListener('click', ()=>{ t.classList.remove('show'); setView(gotoPage); });
  t.classList.add('show');
  toastTimer = setTimeout(()=>t.classList.remove('show'), gotoPage ? 4200 : 2500);
}

function openModal(html, wide){

/* ========== 8. 动作层 Actions ========== */
const Actions = {
  toProject({ title, outcome, standard, jobId, source, subtasks, ideaId }){
    const p = { id:uid(), title, outcome:outcome||'', standard:standard||'', recipient:'自己',
      stage:'todo', due:'', priority:'mid', jobId:jobId||null, source:source||'手动创建',
      subtasks:(subtasks||[]).filter(Boolean).map(t=>({text:t,done:false})),
      blockers:[], log:[{t:today(), e:'创建项目'}], createdAt:today(), updatedAt:today(), ideaId:ideaId||null };
    state.projects.unshift(p); save();
    toast('已创建项目：'+title, 'board', '去看看');
    return p;
  },
  toTodayTask({ text, tag, tier, projectId, reason }){
    if(!text) return null;
    const t = { id:uid(), text, tag:tag||'待办', tier:tier||'must', projectId:projectId||null, done:false, reason:reason||'', source:'manual' };
    state.todayTasks.push(t); save();
    toast('已加入今日任务', 'today', '去看看');
    return t;
  },
  toCandidatePool(jobId){
    if(state.candidatePool.includes(jobId)){ toast('这个岗位已经在候选池里了'); return; }
    state.candidatePool.push(jobId); save();
    toast(`已加入候选池（共 ${state.candidatePool.length} 个）`, 'jobs', '去看看');
  },
  toApplication({ company, jobId, round, nextRound }){
    const a = { id:uid(), company, jobId:jobId||null, round:round||'简历已投', nextRound:nextRound||'', status:'进行中', appliedAt:today(), note:'' };
    state.applications.unshift(a); save();
    toast('已记录投递：'+company, 'today', '去看看');
    return a;
  },
  toWrongBook({ q, type, reason }){
    if(state.interview.wrongBook.some(w=>w.q===q)) return;
    state.interview.wrongBook.push({ q, type, reason:reason||'', addedAt:today() }); save();
  },
  prepChecklistProject(jobId){
    const job = JOB_BY_ID[jobId]; if(!job) return null;
    const mj = state.myJobs[jobId] || {};
    const subtasks = [...job.prep];
    if(mj.myGap) subtasks.push('补上我的缺口：'+mj.myGap);
    return Actions.toProject({
      title:`准备清单 · ${job.name}`,
      outcome:`具备投递「${job.name}」的基本条件`,
      standard:'每条准备项都有可展示的成果',
      jobId, source:'岗位认知库', subtasks
    });
  }
};

/* ========== 10. 渲染入口 ========== */
const VIEWS = {};
function render(){
  renderNav();
  const el = document.getElementById('appContent');
  el.innerHTML = (VIEWS[activePage] || VIEWS.today)();
  bindView(el);

function bindView(root){
  (root||document).querySelectorAll('[data-view]').forEach(b=>{
    if(b._bound) return; b._bound = true;
    b.addEventListener('click', ()=>setView(b.dataset.view));
  });
  (root||document).querySelectorAll('[data-action]').forEach(b=>{
    if(b._bound) return; b._bound = true;
    b.addEventListener('click', handleAction);
  });
}
function handleAction(e){
  const btn = e.currentTarget;
  const a = btn.dataset.action;
  const raw = btn.dataset.id;
  const id = (raw === undefined || raw === '' || isNaN(Number(raw))) ? raw : Number(raw);
  const H = ACTION_HANDLERS[a];
  if(H) H(btn, id, e);
}

    '认知':'tag-blue','探索':'tag-orange','面试':'tag-green','收集':'tag-gray','待分类':'tag-gray','新想法':'tag-green' };

function stepTrack(steps, idx){
  return `<div class="step-track">${steps.map((s,i)=>{
    const cls = i < idx ? 'done' : i === idx ? 'now' : '';

    return `${i?`<span class="step-arrow">→</span>`:''}<span class="step-node ${cls}">${mark} ${esc(s)}</span>`;

/* ========== 14. 页面：游戏化职业探索 ========== */
function pendingJobs(){ return JOBS.filter(j=>!state.explore.swipedJobs.includes(j.id)); }
VIEWS.explore = ()=>{
  const pend = pendingJobs();
  const card = pend[0];
  const liked = state.explore.swipedJobs.filter(id=>(state.myJobs[id]||{}).myInterest>=3);
  const skipped = state.explore.swipedJobs.filter(id=>(state.myJobs[id]||{}).myInterest<3);

  const tagCount = {};
  liked.forEach(id=>{ const j=JOB_BY_ID[id]; if(j) j.caps.forEach(c=>{ tagCount[c.name]=(tagCount[c.name]||0)+1; }); });
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const skipCatCount = {};
  skipped.forEach(id=>{ const j=JOB_BY_ID[id]; if(j){ const n=(CAT_BY_ID[j.cat]||{}).name||j.cat; skipCatCount[n]=(skipCatCount[n]||0)+1; } });
  const likedCats = {};
  liked.forEach(id=>{ const j=JOB_BY_ID[id]; if(j){ const n=(CAT_BY_ID[j.cat]||{}).name||j.cat; likedCats[n]=(likedCats[n]||0)+1; } });
  const topSkip = Object.entries(skipCatCount).sort((a,b)=>b[1]-a[1])
    .find(([cat,n])=> n>=2 && n > (likedCats[cat]||0)) || null;
  const recJobs = liked.map(id=>JOB_BY_ID[id]).filter(Boolean).slice(0,2);
  const gapJobs = liked.map(id=>({j:JOB_BY_ID[id], m:state.myJobs[id]})).filter(x=>x.j && !(x.m.myEvidence||'').trim());

  const total = state.explore.swipedJobs.length;
  const analysis = total===0
    ? `<p class="muted" style="font-size:14px;line-height:1.7">还没有滑动记录。先滑几张，这里会根据你的实际选择给出有依据的建议。</p>`
    : `<p style="font-size:14px;line-height:1.8">
        ${topTags.length?`你右滑的岗位里，<strong>${topTags.slice(0,3).map(t=>esc(t[0])).join('、')}</strong> 这几项能力反复出现。`:'你还没有右滑任何岗位。'}
        ${recJobs.length?`建议接下来重点看 <strong>${recJobs.map(j=>esc(j.name)).join('</strong> 和 <strong>')}</strong>。`:''}
       </p>
       <details class="evidence"><summary style="cursor:pointer;font-size:13px;color:var(--primary);font-weight:600">▸ 依据（点击展开）</summary>
         <div><span class="k">样本可信度</span><span>${total<8?`⚠️ 只滑了 ${total} 张，还不足以下结论。至少滑到 8 张，下面的规律才有意义。`:`已滑 ${total} 张，可以看规律了。`}</span></div>
         <div><span class="k">样本量</span><span>共滑动 ${total} 张，右滑 ${liked.length} 张（${Math.round(liked.length/total*100)}%），左滑 ${skipped.length} 张</span></div>
         <div><span class="k">能力频次</span><span>${topTags.length?topTags.map(t=>`${esc(t[0])} ×${t[1]}`).join(' · '):'暂无'}</span></div>
         <div><span class="k">大类集中</span><span>${Object.entries(likedCats).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')||'暂无'}</span></div>
         <div><span class="k">反向信号</span><span>${topSkip?`左滑里 ${esc(topSkip[0])} 占 ${topSkip[1]} 张，且明显多于你右滑的同类数量 → 这个方向大概率不适合你`:'暂无明显反向信号'}</span></div>
         <div><span class="k">证据缺口</span><span>${gapJobs.length?`${gapJobs.map(x=>esc(x.j.name)).join('、')} 你标了感兴趣，但「我的证据」还是空的 → 下一步补一段能拿得出手的经历`:'暂无缺口'}</span></div>
       </details>`;

  return `<div class="explore-layout">
    <div class="card" style="display:flex;flex-direction:column;align-items:center">
      <div class="card-title" style="width:100%"><span>🎮 滑动探索职业方向</span><span class="muted" style="font-size:12px;font-weight:400">还剩 ${pend.length} / ${JOBS.length}</span></div>
      <p class="muted" style="font-size:14px;margin-bottom:8px;text-align:center">左滑无感，右滑感兴趣。不急着下结论，先收集体感。</p>
      <div class="card-stack" id="cardStack">
        ${card?`<div class="explore-card" id="currentCard">
          <div class="explore-icon">${card.icon}</div>
          <div class="explore-title">${esc(card.name)}</div>
          <div class="explore-desc">${esc(card.summary)}</div>
          <div>${card.caps.slice(0,3).map(c=>`<span class="tag tag-blue">${esc(c.name)}</span>`).join('')}</div>
          <button class="btn btn-sm btn-secondary" style="margin-top:16px" data-action="open-job" data-id="${esc(card.id)}">先看详情再决定</button>
        </div>`:`<div style="text-align:center;color:var(--text-light)">
          <div style="font-size:48px;margin-bottom:16px">🎉</div>
          <h3 style="color:var(--text);margin-bottom:8px">本轮探索完成</h3>
          <p>已收集 ${liked.length} 个感兴趣方向。</p>
          <button class="btn btn-primary" style="margin-top:16px" data-action="pool-to-project">把候选岗位生成探索项目</button>
          <button class="btn btn-secondary" style="margin-top:16px" data-action="reset-explore">重新开始一轮</button>
        </div>`}
      </div>
      ${card?`<div class="swipe-actions">
        <button class="swipe-btn no" data-action="swipe" data-dir="left" title="无感">✕</button>
        <button class="swipe-btn yes" data-action="swipe" data-dir="right" title="感兴趣">♥</button>
      </div>
      <p class="muted" style="font-size:13px;margin-top:12px">提示：也可以用键盘 ← → 方向键</p>`:''}
    </div>
    <div>
      <div class="card">
        <div class="card-title"><span>📝 探索记录</span>${state.candidatePool.length?`<span class="muted" style="font-size:12px;font-weight:400">候选池 ${state.candidatePool.length}</span>`:''}</div>
        <div id="exploreRecords">
          ${state.explore.swipedJobs.length?state.explore.swipedJobs.slice().reverse().map(id=>{
            const j=JOB_BY_ID[id]; if(!j) return '';
            const like=(state.myJobs[id]||{}).myInterest>=3;
            return `<div class="explore-record-item">
              <div style="display:flex;justify-content:space-between;gap:10px">
                <strong>${j.icon} ${esc(j.name)}</strong>
                <span style="color:${like?'var(--primary)':'var(--text-light)'};white-space:nowrap">${like?'♥ 感兴趣':'✕ 跳过'}</span>
              </div>
              <div class="muted" style="font-size:12px;margin-top:4px">${esc((CAT_BY_ID[j.cat]||{}).name||'')} · ${like?'已加入候选探索方向':'暂时不感兴趣'}</div>
            </div>`;
          }).join(''):'<p class="muted" style="font-size:14px">还没有记录，开始滑动吧～</p>'}
        </div>
      </div>
      <div class="card" style="margin-top:20px">
        <div class="card-title">🧩 偏好分析</div>
        ${analysis}
      </div>
    </div>
  </div>`;
};

/* ========== 15. 页面：岗位认知库 ========== */
let jobFilter = 'all', jobQuery = '';
function matchJob(j, q){
  if(!q) return true;
  q = q.toLowerCase();
  const hay = [j.name, (CAT_BY_ID[j.cat]||{}).name, j.summary, j.salary,
    ...j.caps.map(c=>c.name+' '+c.build), ...j.duties.map(d=>d.task+' '+d.how),
    ...j.prep, ...j.path, ...j.themes].join(' ').toLowerCase();
  return hay.includes(q);
}
VIEWS.jobs = ()=>{
  const list = JOBS.filter(j=>(jobFilter==='all'||j.cat===jobFilter) && matchJob(j, jobQuery));
  return `
  <div class="filter-bar">
    <input class="input" id="jobSearch" style="max-width:280px" placeholder="🔍 搜岗位名 / 能力 / 技能，如 SQL、谈判" value="${esc(jobQuery)}">
    <button class="filter-btn ${jobFilter==='all'?'active':''}" data-action="filter-jobs" data-key="all">全部 ${JOBS.length}</button>
    ${CATEGORIES.map(c=>`<button class="filter-btn ${jobFilter===c.id?'active':''}" data-action="filter-jobs" data-key="${c.id}">${c.icon} ${esc(c.name)} ${JOBS.filter(j=>j.cat===c.id).length}</button>`).join('')}
  </div>
  <p class="muted" style="font-size:13px;margin:-8px 0 16px">共 ${JOBS.length} 个岗位 · 当前显示 ${list.length} 个 · 点开卡片可以看到「每项能力具体用在工作内容的哪一步」</p>
  <div class="grid-3" id="jobGrid">
    ${list.length?list.map(j=>{
      const m = state.myJobs[j.id];
      const inPool = state.candidatePool.includes(j.id);
      return `<button class="job-card" data-action="open-job" data-id="${esc(j.id)}">
        <h3>${j.icon} ${esc(j.name)} ${inPool?'<span class="tag tag-green">候选池</span>':''}</h3>
        <p>${esc(j.summary)}</p>
        <div>${j.caps.slice(0,2).map(c=>`<span class="tag tag-blue">${esc(c.name)}</span>`).join('')}<span class="tag tag-gray">${esc((CAT_BY_ID[j.cat]||{}).name||'')}</span></div>
        <div class="muted" style="font-size:12px;margin-top:10px">需求 ${esc(j.demand)} · 门槛 ${esc(j.barrier)} · ${esc(j.salary)}</div>
        ${m&&m.myInterest?`<div style="font-size:12px;margin-top:6px;color:var(--primary)">我的兴趣 ${m.myInterest}/5</div>`:''}
      </button>`;
    }).join(''):'<div class="empty" style="grid-column:1/-1">没有匹配的岗位，换个关键词试试</div>'}
  </div>`;
};

function heatMap(){
  const cells = [];
  const d = new Date();
  d.setDate(d.getDate() - 83);
  while(d.getDay()!==1) d.setDate(d.getDate()-1);
  for(let i=0;i<91;i++){
    const k = d.toISOString().slice(0,10);
    const hit = state.checkins[k];
    cells.push(`<div class="heat-cell ${hit?'l'+Math.min(hit,3):''}" title="${k}${hit?' · 有记录':''}"></div>`);
    d.setDate(d.getDate()+1);
  }
  return `<div class="heat">${cells.join('')}</div>`;
}
function myTags(){
  const out = [];
  const capCount = {};
  state.explore.swipedJobs.filter(id=>(state.myJobs[id]||{}).myInterest>=3)
    .forEach(id=>{ const j=JOB_BY_ID[id]; if(j) j.caps.filter(c=>c.level==='核心').forEach(c=>capCount[c.name]=(capCount[c.name]||0)+1); });
  Object.entries(capCount).sort((a,b)=>b[1]-a[1]).slice(0,4).forEach(([n,v])=>{
    const hasEvidence = state.explore.swipedJobs.some(id=>(state.myJobs[id]||{}).myInterest>=3 && (state.myJobs[id]||{}).myEvidence);
    out.push({ name:n, verified:hasEvidence, src:`探索中右滑 ${v} 个岗位都把它列为核心能力${hasEvidence?'':'，但你还没在这些岗位下填写「我的证据」'}` });
  });
  const skills = {excel:'Excel',sql:'SQL',python:'Python',english:'英语',design:'设计/剪辑',writing:'文案写作'};
  state.profile.skills.forEach(s=>out.push({ name:skills[s]||s, verified:true, src:'来自你在「个人档案」里勾选的已掌握技能' }));
  return out;
}

function doSwipe(dir){
  const pend = pendingJobs();
  if(!pend.length) return;
  const job = pend[0];
  const card = document.getElementById('currentCard');
  if(card) card.classList.add(dir==='right'?'swipe-right':'swipe-left');
  const m = myJob(job.id);
  m.myInterest = dir==='right' ? Math.max(m.myInterest||0, 4) : (m.myInterest? m.myInterest : 1);
  if(dir==='right' && !state.candidatePool.includes(job.id)) state.candidatePool.push(job.id);
  state.explore.swipedJobs.push(job.id);
  save();
  setTimeout(()=>render(), 280);
  toast(dir==='right'?`♥ 感兴趣：${job.name}，已加入候选池`:`✕ 跳过：${job.name}`);
}

function fmtTime(s){ return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function startInterview(at){
  ivRunning=true; ivPaused=false; ivSeconds=0; ivQIndex=at||0; ivPerQ=0;
  clearInterval(ivTimer); clearInterval(ivQTimer);
  ivTimer = setInterval(()=>{
    if(ivPaused||!ivRunning) return;
    ivSeconds++; ivPerQ++;
    const t=document.getElementById('ivTimer'); if(t) t.textContent=fmtTime(ivSeconds);
    const perQ = state.interview.settings.perQuestion;
    if(perQ && ivPerQ>=perQ){ ivPerQ=0; ivQIndex=(ivQIndex+1)%INTERVIEW_QUESTIONS[ivType].length; render(); }
  }, 1000);
  render();
}
function toggleInterview(){
  if(!ivRunning){ startInterview(); return; }
  clearInterval(ivTimer); clearInterval(ivQTimer);
  ivRunning=false; ivPaused=false;
  const list = INTERVIEW_QUESTIONS[ivType];
  const rates = {完整:3,逻辑:3,具体:3,表达:3};
  state.interview.history.push({ id:uid(), type:ivType, date:today(), duration:fmtTime(ivSeconds), count:list.length, selfRate:rates, note:'' });
  const low = Object.entries(rates).filter(([k,v])=>v<=2);
  if(low.length) list.forEach(q=>Actions.toWrongBook({q:q.q, type:ivType, reason:low.map(l=>l[0]+'偏低').join('、')}));
  state.checkins[today()] = (state.checkins[today()]||0)+1;
  save(); render();
  toast(`本次练习已记录（${fmtTime(ivSeconds)}，${list.length} 题）。P7 会补上逐题记录与四维自评。`);
}

  if(!done){ const idx=state.assessment.answers.length, q=FULL_SURVEY[idx]; return `<div class="card"><div class="card-title">📝 个人档案与优势测评 <span class="muted" style="font-size:12px">自研 24 主题 · 约 8 分钟</span></div><p class="muted" style="margin-bottom:18px">框架参考优势心理学。每一题都会自动保存，可中途退出。</p><div class="progress-bar"><div class="progress-fill" style="width:${idx/48*100}%"></div></div><h3 style="margin:24px 0 8px">${idx+1} / 48 · ${esc(q.domain)} · ${esc(q.theme)}</h3><p style="font-size:18px;line-height:1.7;margin-bottom:20px">${esc(q.text)}</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${[['1','很不同意'],['2','不同意'],['3','一般'],['4','同意'],['5','很同意']].map(([v,l])=>`<button class="option-card" data-action="full-survey-answer" data-v="${v}"><div class="ot">${v}</div><div class="od">${l}</div></button>`).join('')}</div>${idx?'<button class="btn btn-secondary" style="margin-top:18px" data-action="full-survey-back">← 修改上一题</button>':''}</div>`; }
  const low=Object.entries(r.domains).sort((a,b)=>a[1]-b[1])[0][0]; const high=Object.entries(r.domains).sort((a,b)=>b[1]-a[1])[0][0];
  const recs=JOBS.filter(j=>j.themes&&j.themes.some(t=>r.top5.includes(t))).slice(0,3);
  return `<div class="card"><div class="card-title">🎯 你的优势画像</div><p class="muted">完成于 ${esc(state.assessment.doneAt||today())} · 这是自我探索工具，不是能力定论。</p><h3 style="margin:22px 0 10px">Top 5 优势主题</h3>${r.top5.map((t,i)=>`<p style="line-height:1.9"><strong>${i+1}. ${esc(t)}</strong>：${esc(THEME_PROMPTS[t])}</p>`).join('')}<h3 style="margin:22px 0 10px">四领域分布</h3>${Object.entries(r.domains).map(([n,v])=>`<div style="display:grid;grid-template-columns:100px 1fr 40px;gap:10px;margin:8px 0;align-items:center"><span>${esc(n)}</span>${progressBar(v,60)}<span>${v}</span></div>`).join('')}<div class="result-block" style="margin-top:22px"><h4>你的组合意味着什么</h4><p>${esc(r.top5[0])} + ${esc(r.top5[1])} 说明你更可能在「先想清楚、再有序推进」的工作中发挥稳定。优势最高的是 ${esc(high)}；相对需要刻意补位的是 ${esc(low)}。</p><p style="margin-top:8px">下一步：从推荐岗位中选一个，填入你的证据与缺口，再做一个小验证项目。</p></div><div class="grid-3" style="margin-top:20px">${recs.map(j=>`<div class="card"><h3>${j.icon} ${esc(j.name)}</h3><p class="muted" style="font-size:13px;margin:8px 0">优势契合：${j.themes.filter(t=>r.top5.includes(t)).join('、')||'证据不足'}</p><button class="btn btn-sm btn-primary" data-action="pool-job" data-id="${j.id}">加入候选池</button> <button class="btn btn-sm btn-secondary" data-action="open-job" data-id="${j.id}">看详情</button></div>`).join('')}</div><div style="margin-top:20px"><button class="btn btn-secondary" data-action="full-survey-reset">重新测评</button> <button class="btn btn-primary" data-action="gen-plan">生成求职计划</button></div></div>`;
};

/* 收集箱五路径问答和候选行动。 */
let clarifyState=null;
function deriveActions(session){ const a=session.answers||[], get=i=>a[i]||''; if(session.path==='large') return [{kind:'project',text:get(0)||session.raw,subtasks:get(5).split(/[，、\n]/).filter(Boolean)},{kind:'task',text:get(6)||'写下今天最小的一步'}]; if(session.path==='start') return [{kind:'task',text:get(2)||'开始一个 15 分钟动作'}]; if(session.path==='direction') return [{kind:'task',text:get(4)||'验证一个方向假设'},{kind:'jobs',text:'查看 3 个相关岗位'}]; return [{kind:'task',text:get(PATH_ACTION_INDEX[session.path])||'整理下一步'},{kind:'project',text:session.raw,subtasks:['补齐已知与未知','验证下一步判断']}]; }
function renderClarify(){ const s=clarifyState, set=questionSets[s.path]; if(!set){ openModal(`${modalHead('先理顺一下')}<p class="muted">这条想法现在最像哪一种情况？</p><div class="grid-2" style="margin-top:16px">${Object.entries(questionSets).map(([id,x])=>`<button class="option-card" data-action="choose-path" data-path="${id}"><div class="ot">${x.icon} ${esc(x.label)}</div><div class="od">${esc(x.strategy)}</div></button>`).join('')}</div>`,true); return; } const i=s.current; if(i>=set.questions.length){ const acts=deriveActions(s); openModal(`${modalHead('理顺结果')}<p><strong>原始想法：</strong>${esc(s.raw)}</p><p class="muted" style="margin:8px 0">${set.icon} ${esc(set.label)} · ${esc(set.strategy)}</p><div class="card" style="margin:14px 0;background:var(--bg)">${set.questions.map((q,n)=>`<p style="margin:8px 0"><strong>${n+1}.</strong> ${esc(q)}<br><span class="muted">${esc(s.answers[n]||'已跳过')}</span></p>`).join('')}</div>${acts.map((x,n)=>`<div class="candidate"><div><strong>${x.kind==='project'?'📋 项目':'✅ 行动'}：${esc(x.text)}</strong></div><button class="btn btn-sm btn-primary" data-action="clarify-act" data-idx="${n}">${x.kind==='project'?'转项目':x.kind==='jobs'?'看岗位':'加入今日'}</button></div>`).join('')}`,true); return; } openModal(`${modalHead(`${set.icon} ${set.label} · ${i+1}/${set.questions.length}`)}<p style="font-size:18px;margin:20px 0">${esc(set.questions[i])}</p><textarea class="input" id="clarifyAnswer" placeholder="写下你的答案；也可以跳过"></textarea><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary" data-action="clarify-next">下一题</button><button class="btn btn-secondary" data-action="clarify-skip">跳过</button></div>`,true); }

/* 面试逐题记录和自评。 */
let practice={running:false,type:'behavior',index:0,started:0,answers:[]};
VIEWS.interview=()=>{const q=INTERVIEW_QUESTIONS[practice.type][practice.index]; return `<div class="grid-2"><div class="card"><div class="card-title">🎤 面试练习中心</div><div class="filter-bar">${INTERVIEW_TYPES.map(t=>`<button class="filter-btn ${practice.type===t.id?'active':''}" data-action="practice-type" data-type="${t.id}">${t.icon} ${t.name}</button>`).join('')}</div><p class="muted">${practice.running?'正在练习，可写下答题要点后逐题自评。':'选择题型后开始；记录会保存到复盘与错题库。'}</p>${practice.running?`<h3 style="margin:18px 0">第 ${practice.index+1} 题：${esc(q.q)}</h3><p class="muted">框架：${esc(q.framework)}</p><textarea class="input" id="practiceAnswer" placeholder="写下你的答题要点"></textarea><div class="filter-bar" style="margin-top:12px">${['完整','逻辑','具体','表达'].map(k=>`<label>${k} <select id="rate-${k}" class="input" style="width:65px"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>`).join('')}</div><button class="btn btn-primary" data-action="practice-next">${practice.index+1===INTERVIEW_QUESTIONS[practice.type].length?'完成复盘':'保存下一题'}</button> <button class="btn btn-secondary" data-action="practice-stop">结束练习</button>`:`<button class="btn btn-primary" style="margin-top:18px" data-action="practice-start">开始模拟面试</button>`}</div><div class="card"><div class="card-title">⚠️ 错题库</div>${state.interview.wrongBook.length?state.interview.wrongBook.map(w=>`<div class="candidate"><div><strong>${esc(w.q)}</strong><p>${esc(w.reason||'需要重练')}</p></div><button class="btn btn-sm btn-secondary" data-action="retrain" data-q="${esc(w.q)}">重练</button></div>`).join(''):'<div class="empty">暂无错题。任一维度自评 1-2 分会自动收进这里。</div>'}<div class="card-title" style="margin-top:22px">历次复盘</div>${state.interview.history.slice(0,6).map(h=>`<p class="muted" style="margin:8px 0">${esc(h.date)} · ${esc(h.type)} · ${esc(h.duration||'')} · ${h.count||0} 题</p>`).join('')}</div></div>`;};

Object.assign(ACTION_HANDLERS,{
  'full-survey-answer':b=>{state.assessment.answers.push(Number(b.dataset.v)); if(state.assessment.answers.length===48){const r=assessmentResult(); state.assessment.themeScores=r.scores;state.assessment.top5=r.top5;state.assessment.domainScores=r.domains;state.assessment.doneAt=today();} save();render();},
  'full-survey-back':()=>{state.assessment.answers.pop();save();render();}, 'full-survey-reset':()=>{state.assessment={answers:[],themeScores:{},top5:[],domainScores:{},doneAt:null};save();render();},
  'clarify-idea':(b,id)=>{const i=state.ideas.find(x=>x.id===id);if(!i)return;clarifyState={ideaId:id,raw:i.raw,path:null,current:0,answers:[]};renderClarify();},
  'choose-path':b=>{clarifyState.path=b.dataset.path;clarifyState.current=0;renderClarify();},
  'clarify-next':()=>{clarifyState.answers.push((document.getElementById('clarifyAnswer')||{}).value.trim());clarifyState.current++;renderClarify();},
  'clarify-skip':()=>{clarifyState.answers.push('');clarifyState.current++;renderClarify();},
  'clarify-act':b=>{const x=deriveActions(clarifyState)[Number(b.dataset.idx)];if(x.kind==='project')Actions.toProject({title:x.text,outcome:clarifyState.raw,source:'收集箱理顺',subtasks:x.subtasks,ideaId:clarifyState.ideaId});else if(x.kind==='jobs')setView('jobs');else Actions.toTodayTask({text:x.text,tag:'收集',reason:'来自收集箱理顺结果'});const i=state.ideas.find(v=>v.id===clarifyState.ideaId);if(i){i.path=clarifyState.path;i.status='已理顺';state.sessions.push(Object.assign({id:uid(),created:today(),status:'done'},clarifyState));save();}closeModal();render();},
  'open-company':b=>{const candidates=JOBS.filter(j=>j.cat==='crossborder'||j.cat==='trade').slice(0,4);openModal(`${modalHead(b.dataset.name)}<p><strong>梯度：</strong>${esc(b.dataset.tier)} · ${esc(b.dataset.industry)}</p><p><strong>业务：</strong>请在投递前通过官网、财报和真实 JD 核对主营产品、近期动向与招聘计划。</p><p><strong>文化与发展：</strong>不同团队差异很大；面试时可以追问目标、协作方式和成长反馈。</p><p><strong>对你的提示：</strong>先把一个关联岗位的经历准备成可量化案例，再决定是否投递。</p><h3 style="margin-top:16px">可先了解的关联岗位</h3>${candidates.map(j=>`<button class="btn btn-sm btn-secondary" data-action="open-job" data-id="${j.id}">${j.icon} ${esc(j.name)}</button>`).join(' ')}<button class="btn btn-primary" style="margin-top:18px" data-action="company-apply" data-name="${esc(b.dataset.name)}">我想投这家</button>`,true);},
  'company-apply':b=>{Actions.toApplication({company:b.dataset.name,round:'简历已投'});closeModal();render();},
  'practice-type':b=>{if(!practice.running){practice.type=b.dataset.type;practice.index=0;render();}},
  'practice-start':()=>{practice={running:true,type:practice.type,index:0,started:Date.now(),answers:[]};render();},
  'practice-next':()=>{const rates={};['完整','逻辑','具体','表达'].forEach(k=>rates[k]=Number((document.getElementById(`rate-${k}`)||{}).value)||3);const q=INTERVIEW_QUESTIONS[practice.type][practice.index];practice.answers.push({q:q.q,points:(document.getElementById('practiceAnswer')||{}).value||'',rates});if(Object.values(rates).some(v=>v<=2))Actions.toWrongBook({q:q.q,type:practice.type,reason:'本次自评存在 1-2 分项'});if(practice.index+1<INTERVIEW_QUESTIONS[practice.type].length){practice.index++;render();return;} ACTION_HANDLERS['practice-stop']();},
  'practice-stop':()=>{if(!practice.running)return;const duration=fmtTime(Math.round((Date.now()-practice.started)/1000));state.interview.history.unshift({id:uid(),type:practice.type,date:today(),duration,count:practice.answers.length,answers:practice.answers});state.checkins[today()]=(state.checkins[today()]||0)+1;practice.running=false;save();render();toast('复盘已保存，低分题已进入错题库');},
  'global-search':()=>openModal(`${modalHead('全局搜索')}<input class="input" id="globalQuery" placeholder="搜索岗位、项目或公司"><div id="globalResult" style="margin-top:14px"></div>`),
  'export-data':()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='拆招数据备份.json';a.click();URL.revokeObjectURL(a.href);}
});

function openAudioDB3(){return new Promise((resolve,reject)=>{if(!globalThis.indexedDB)return reject(Error('此浏览器不支持录音持久保存'));const req=indexedDB.open('chaizhao-portfolio-audio-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('recordings',{keyPath:'id'});req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result);});}

function openAssetDB4(){return new Promise((resolve,reject)=>{

async function asset4(mode,value){const db=await openAssetDB4();try{return await new Promise((resolve,reject)=>{
  const tx=db.transaction('assets',mode==='get'||mode==='all'?'readonly':'readwrite');
  const store=tx.objectStore('assets');
  const req=mode==='get'?store.get(value):mode==='all'?store.getAll():mode==='delete'?store.delete(value):store.put(value);
  let result;req.onsuccess=()=>result=req.result;req.onerror=()=>reject(req.error);
  tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('附件存储中断'));
})}finally{db.close();}}
